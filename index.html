<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEAD STICK — the captain is down. Land her yourself.</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06090f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<!-- Root copy of game/index.html (paths prefixed with game/) so the site root plays directly.
     The kit entry remains game/index.html; keep the two in step. -->
<body>
<canvas id="game" aria-label="DEAD STICK: a cockpit survival flight game. The captain has passed out; fix the failing systems from the pilot seat and land the plane yourself."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./game/vendor/three.min.js"></script>
<script type="module" src="./game/src/main.js"></script>
</body>
</html>
